name: CI

# Le pipeline de l'équipe : linter et tests à chaque push.
on:
  push:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Lancer le linter
        run: npm run lint

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Lancer les tests unitaires
        run: npm test

  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
      - name: Construire l’image Docker
        run: docker build -t ghcr.io/pg56yac/i324_s4_livrer:samuelantunes1 .
      - name: Se connecter à GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publier l’image Docker
        run: docker push ghcr.io/pg56yac/i324_s4_livrer:samuelantunes1
